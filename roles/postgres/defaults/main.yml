---
postgres__version: "12"

postgres__data_dir: /data/postgres/data

postgres__opts:
  listen_addresses: "'localhost'"
  port: 5432
  max_connections: 100
  shared_buffers: 128MB

postgres__hba_rules:
  - type: local
    database: all
    user: postgres
    address: ""
    method: peer

  - type: local
    database: all
    user: all
    address: ""
    method: peer

  - type: host
    database: all
    user: all
    address: 127.0.0.1/32
    method: scram-sha-256

  - type: host
    database: all
    user: all
    address: "::1/128"
    method: scram-sha-256

postgres__databases:
  - name: app_db

postgres__users:
  - name: app_user
    password: "{{vault_postgres_app_password}}"
    databases:
      - app_db

postgres__exporter_package: prometheus-postgres-exporter
postgres__exporter_port: 9187
postgres__exporter_user: prometheus
