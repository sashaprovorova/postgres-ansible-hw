---
- name: create /data directory
  ansible.builtin.file:
    path: /data
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: create PostgreSQL parent directory
  ansible.builtin.file:
    path: "{{postgres__data_dir|dirname}}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: create PostgreSQL data directory
  ansible.builtin.file:
    path: "{{postgres__data_dir}}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: initialize PostgreSQL cluster
  ansible.builtin.command:
    cmd: "{{__pg_bin_dir}}/pg_ctl initdb -D {{postgres__data_dir}}"
    creates: "{{postgres__data_dir}}/PG_VERSION"
  become: true
  become_user: postgres
